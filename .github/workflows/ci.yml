name: CI Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Validate Python scripts syntax
      run: |
        python3 -m py_compile *.py

    - name: Validate shell scripts syntax
      run: |
        bash -n installer.sh
        bash -n scenarios/*.sh
